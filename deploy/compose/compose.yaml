# Euron Open SQLAgent: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 5410   api 5430   mailpit 5425   mock model provider 5450
#   postgres 5442   redis 5479   floci 5466
#   demo databases SQLAgent connects to: postgres 5443 (shop), mysql 5406 (people)
name: sqlagent

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  SQLAGENT_CLOUD: local
  LOG_LEVEL: ${SQLAGENT_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://sqlagent:sqlagent@postgres:5432/sqlagent
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/objects
  WORK_DIR: /data/work
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api with X-Forwarded-For; trust it on the Compose
  # network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${SQLAGENT_WEB_PORT:-5410},http://127.0.0.1:${SQLAGENT_WEB_PORT:-5410}
  PUBLIC_URL: http://localhost:${SQLAGENT_WEB_PORT:-5410}
  # Notices land in Mailpit (http://localhost:5425).
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SQLAGENT_DEMO_PASSWORD: ${SQLAGENT_DEMO_PASSWORD:?run `make env` first}
  SQLAGENT_DEMO_MOCK_URL: http://mock-ai:5450
  # The demo seed writes the demo databases with these (SQLAgent itself only gets
  # read-only logins).
  SQLAGENT_DEMO_SOURCE_PG_ADMIN: postgresql://shop_admin:${SQLAGENT_SOURCE_ADMIN_PASSWORD:?run `make env` first}@source-postgres:5432/shop
  SQLAGENT_DEMO_SOURCE_MYSQL_ADMIN: mysql://root:${SQLAGENT_SOURCE_ADMIN_PASSWORD:?run `make env` first}@source-mysql:3306/people
  SQLAGENT_DEMO_READER_PASSWORD: ${SQLAGENT_READER_PASSWORD:?run `make env` first}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: sqlagent
      POSTGRES_USER: sqlagent
      POSTGRES_PASSWORD: sqlagent
    ports:
      - "127.0.0.1:${SQLAGENT_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent -d sqlagent"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Rate limits and the dashboard cache. Everything durable lives in Postgres.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${SQLAGENT_REDIS_PORT:-5479}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Demo database: a "shop" PostgreSQL that SQLAgent queries through a read-only login.
  source-postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: ${SQLAGENT_SOURCE_ADMIN_PASSWORD:?run `make env` first}
    ports:
      - "127.0.0.1:${SQLAGENT_SOURCE_PG_PORT:-5443}:5432"
    volumes:
      - sourcepg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_admin -d shop"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Demo database: a "people" MySQL (departments, employees, salaries).
  source-mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: ${SQLAGENT_SOURCE_ADMIN_PASSWORD:?run `make env` first}
      MYSQL_DATABASE: people
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    ports:
      - "127.0.0.1:${SQLAGENT_SOURCE_MYSQL_PORT:-5406}:3306"
    volumes:
      - sourcemysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Catches mail locally (SMTP 1025, web UI on 5425).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${SQLAGENT_MAILPIT_PORT:-5425}:8025"
    restart: unless-stopped

  # A deterministic model provider speaking the OpenAI, Anthropic, Gemini and Ollama wire
  # formats, so tests, e2e and the demo need no real provider key (and no network).
  mock-ai:
    build:
      <<: *server-build
      target: api
    image: sqlagent-api:local
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockai.app:app", "--host", "0.0.0.0", "--port", "5450"]
    ports:
      - "127.0.0.1:${SQLAGENT_MOCK_AI_PORT:-5450}:5450"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5450/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: sqlagent-api:local
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai:
        condition: service_started
    restart: "no"

  api:
    image: sqlagent-api:local
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${SQLAGENT_API_PORT:-5430}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Answers queued questions (several at once): the model call, the SQL guard, the
  # read-only execution, the result snapshot.
  worker:
    image: sqlagent-api:local
    command: ["worker"]
    environment:
      <<: *api-env
      WORKER_CONCURRENCY: ${SQLAGENT_WORKER_CONCURRENCY:-8}
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    # The worker serves no HTTP: it is healthy while its metrics endpoint answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Periodic work: schema refresh, the lease reaper, retention.
  scheduler:
    image: sqlagent-api:local
    command: ["scheduler"]
    environment:
      <<: *api-env
      WORKER_METRICS_PORT: "0"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: sqlagent-web:local
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:${SQLAGENT_WEB_PORT:-5410}:3000"
    read_only: true
    tmpfs:
      # The node user is uid 1000; Next writes its image cache under .next/cache.
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  sourcepg:
  sourcemysql:
  objects:
  work:
