openapi: 3.1.0
info:
  title: Euron Open SQLAgent
  description: "\nAPI of a self-hosted database assistant: connect PostgreSQL, MySQL or SQLite, ask a\
    \ question\nin plain English, and get one validated, read-only SQL query, its result as a table or\
    \ a\nchart, and a plain-language explanation. Every query passes the SQL guard (exactly one\nread-only\
    \ SELECT) and runs on a connection the database itself holds read-only.\n\n* People sign in with `POST\
    \ /api/v1/auth/login` and send the session token as\n  `Authorization: Bearer <token>` (the dashboard\
    \ uses an HttpOnly cookie instead).\n* Applications, the SDK and the CLI use a project API key: `Authorization:\
    \ Bearer sqa_...`\n  or `X-API-Key: sqa_...`. Scopes: `read`, `query`, `manage`.\n* `POST /api/v1/projects/{project_id}/chat`\
    \ asks a question and waits for the answer;\n  `POST .../sql/explain` explains any query without running\
    \ it.\n"
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in to the dashboard
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
