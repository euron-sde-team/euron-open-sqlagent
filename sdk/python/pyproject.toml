[project]
name = "euron-sqlagent"
version = "0.1.0"
description = "Python SDK and command line for Euron Open SQLAgent: ask questions of your databases in plain English, generate, validate, explain and run read-only SQL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
sqlagent-cli = "euron_sqlagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/euron_sqlagent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
